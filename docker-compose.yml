version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: store_rating_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-store_rating_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-store_rating_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_rating_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-store_rating_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET:-super_secret_store_rating_platform_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 500
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - platform_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: store_rating_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - platform_network

volumes:
  postgres_data:
    name: store_rating_postgres_data

networks:
  platform_network:
    name: store_rating_network
    driver: bridge
